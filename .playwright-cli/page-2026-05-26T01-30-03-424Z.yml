        - heading "FAQ" [level=1] [ref=e265]
        - generic [ref=e266]:
          - generic [ref=e267]:
            - heading "What is the PYPL index ? " [level=4] [ref=e269]:
              - link "What is the PYPL index ? " [ref=e270] [cursor=pointer]:
                - /url: "#collapseZero"
            - generic [ref=e272]:
              - paragraph [ref=e273]: "The PYPL PopularitY of Programming Language Index is created by analyzing how often language tutorials are searched on Google : the more a language tutorial is searched, the more popular the language is assumed to be. It is a leading indicator. The raw data comes from Google Trends."
              - paragraph [ref=e274]: If you believe in collective wisdom, the PYPL Popularity of Programming Language index can help you decide which language to study, or which one to use in a new software project.
          - generic [ref=e275]:
            - heading "Why is PYPL so different from TIOBE ? " [level=4] [ref=e277]:
              - link "Why is PYPL so different from TIOBE ? " [ref=e278] [cursor=pointer]:
                - /url: "#collapseOne"
            - generic [ref=e280]:
              - text: The
              - link "TIOBE Index" [ref=e281] [cursor=pointer]:
                - /url: http://www.tiobe.com/index.php/content/paperinfo/tpci/index.html
              - text: is a lagging indicator. It counts the number of web pages with the language name.
              - mark [ref=e282]: Objective-c programming
              - text: has over 20 million pages on the web,
              - superscript [ref=e283]:
                - link "[s]" [ref=e284] [cursor=pointer]:
                  - /url: https://www.google.be/#hl=fr&tbo=d&output=search&sclient=psy-ab&q=%22objective-c+programming%22&oq=%22objective-c+programming%22&gs_l=hp.3..0l2j0i30l2.3028.3028.0.3908.1.1.0.0.0.0.131.131.0j1.1.0...0.0...1c.1.L2X9Y0uJ0Uk&pbx=1&bav=on.2,or.r_gc.r_pw.r_qf.&bvm=bv.1354675689,d.d2k&fp=c6fa6e161d5c7c9b&bpcl=39650382&biw=1814&bih=1010
              - text: while
              - mark [ref=e285]: C programming
              - text: has only 11 million.
              - superscript [ref=e286]:
                - link "[s]" [ref=e287] [cursor=pointer]:
                  - /url: https://www.google.be/#hl=fr&tbo=d&sclient=psy-ab&q=%22c+programming%22&oq=%22c+programming%22&gs_l=hp.3..0l4.105171.105171.1.106210.1.1.0.0.0.0.217.217.2-1.1.0...0.0...1c.1.i0F5z0y2deM&pbx=1&bav=on.2,or.r_gc.r_pw.r_qf.&bvm=bv.1354675689,d.d2k&fp=c6fa6e161d5c7c9b&bpcl=39650382&biw=1814&bih=1010
              - text: This explains why Objective-C has a high TIOBE ranking. But who is reading those Objective-C web pages ? Hardly anyone, according to Google Trends data.
              - mark [ref=e288]: Objective C programming
              - text: is searched 30 times less than
              - mark [ref=e289]: C programming
              - text: .
              - superscript [ref=e290]:
                - link "[s]" [ref=e291] [cursor=pointer]:
                  - /url: http://www.google.be/trends/explore#q=C%20programming%2C%20objective%20c%20programming&date=today%2012-m&cmpt=q
              - text: In fact, the use of
              - mark [ref=e292]: programming
              - text: by the TIOBE index is misleading (see next question).
          - generic [ref=e293]:
            - heading "Why do you use tutorial as Google Trends keyword ? " [level=4] [ref=e295]:
              - link "Why do you use tutorial as Google Trends keyword ? " [ref=e296] [cursor=pointer]:
                - /url: "#collapseTwo"
                - text: Why do you use
                - mark [ref=e297]: tutorial
                - text: as Google Trends keyword ? 
            - generic [ref=e299]:
              - paragraph [ref=e300]: "The following principles were used:"
              - list [ref=e301]:
                - list [ref=e302]:
                  - listitem [ref=e303]:
                    - text: just the language name, e.g.
                    - mark [ref=e304]: Python
                    - text: ", would lead to inconsistent results, because Python has many other meanings;"
                  - listitem [ref=e305]: the same phrase should be used for all languages, for consistency.
                  - listitem [ref=e306]:
                    - mark [ref=e307]: programming
                    - text: "would not do :"
                    - mark [ref=e308]: C programming
                    - text: is used much more than
                    - mark [ref=e309]: PHP programming
                    - text: ", because PHP does not need the qualifier"
                  - listitem [ref=e310]:
                    - mark [ref=e311]: tutorial
                    - text: "is a word used frequently by developers learning any new language : it makes a good leading indicator. What is a"
                    - mark [ref=e312]: python tutorial
                    - text: ", if not a tutorial on the programming language ?"
                  - listitem [ref=e313]:
                    - mark [ref=e314]: ios tutorial
                    - text: is used instead of the (
                    - link "less popular" [ref=e315] [cursor=pointer]:
                      - /url: http://www.google.com/trends/explore?hl=en-US#q=ios%20tutorial%2C%20objective%20c%20tutorial&cmpt=q
                    - text: )
                    - mark [ref=e316]: objective-c tutorial
                    - text: to better reflect what iPhone developers search. This is confirmed by an analysis of language tag followers on
                    - link "StackOverflow" [ref=e317] [cursor=pointer]:
                      - /url: http://stackoverflow.com/tags
                    - text: ", or of the visits of the Wikipedia language pages"
                    - link "[s]" [ref=e318] [cursor=pointer]:
                      - /url: http://stats.grok.se/en/latest90/objective-c
                      - superscript [ref=e319]: "[s]"
                    - text: ": they give a 4-5% popularity to Objective-C, which is highly consistent with our estimate. It may flatter objective-c's market share because it includes queries of iOS end users."
          - generic [ref=e320]:
            - heading "My favorite language is not in the index ! Why ? " [level=4] [ref=e322]:
              - link "My favorite language is not in the index ! Why ? " [ref=e323] [cursor=pointer]:
                - /url: "#collapseThree"
            - paragraph [ref=e326]:
              - text: The index is currently limited to 29 languages. You can still analyze the popularity of your favorite language and compare it to others, using
              - link "Google Trends" [ref=e327] [cursor=pointer]:
                - /url: http://www.google.com/trends/explore
              - text: ". C++ has the same popularity as C on Google trends: to avoid duplication, it is not included in the PYPL index."
          - generic [ref=e328]:
            - heading "How do you compute the share of web searches ? " [level=4] [ref=e330]:
              - link "How do you compute the share of web searches ? " [ref=e331] [cursor=pointer]:
                - /url: "#collapseFour"
            - generic [ref=e334]:
              - text: We export the data from Google Trends in CSV format,
              - superscript [ref=e335]:
                - link "[s]" [ref=e336] [cursor=pointer]:
                  - /url: http://support.google.com/trends/bin/answer.py?hl=en&answer=87289
              - text: and analyze it with python's pandas. We first calculate the interest of each language tutorials relative to java tutorials every month. Normalizing the total to 100% yields the share of interest in each language, i.e. their popularity, which we smooth over 6 months.
          - generic [ref=e337]:
            - heading "Why is Java so flat in PYPL's diagram, while it is going down in Google Trends over 5 years ? " [level=4] [ref=e339]:
              - link "Why is Java so flat in PYPL's diagram, while it is going down in Google Trends over 5 years ? " [ref=e340] [cursor=pointer]:
                - /url: "#collapseFive"
            - generic [ref=e343]:
              - text: That's because Google Trends diagrams show how the total number of Java tutorial searches varies over time. That has been going significantly down for most programming languages (and most keywords, by the way). Instead, PYPL's diagram shows the share of
              - mark [ref=e344]: Java tutorial
              - text: searches in all language tutorial searches. That share has been fairly stable for Java since 2004.
